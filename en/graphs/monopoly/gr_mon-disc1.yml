    leftControls:
      title: " Tipo di discriminazione: "
      divs:
      - html: "`  `"
      checkboxes:
      - param: disc
        label: "\\text{Discrimina perfettamente}"


    middleControls:
      title: No discriminazione
      description: Selezionare un prezzo lineare uguale per tutti.
      divs:
      - html: "`  `"
      sliders:
      - param: P
        label: P
      show: params.disc == 0

    rightControls:
      title: Discriminazione perfetta
      description: Selezionare quante unità vendere.
      divs:
      - html: "`  `"
      sliders:
      - param: QD
        label: Q
      show: params.disc == 1











    explanation:
        divs:
          - html: "`
                  Il costo marginale del monopolista è pari a $1.50$ euro a biglietto.
                  `"
          - html: "`
                  Ad un prezzo lineare di $P=${params.P}$ euro a biglietto,
                  Alice acquista $ ${calcs.QA}$ biglietti, mentre
                  Bruno ne acquista $ ${calcs.QB}$. Il profitto del monopolista
                  (area verde nel grafico di destra, pari alla somma delle aree verdi nei
                  due grafici a sinistra e al centro) è quindi pari a
                  $$
                  (${params.P}-1.50)\\\\times ${calcs.Q}
                  =
                  ${calcs.profit0}
                  \\\\quad \\\\text{euro}
                  $$
                  Il surplus di Alice (area azzurra nel grafico di sinistra) è
                  pari a $ ${calcs.gaussA}$. 
                  Il surplus di Bruno (area azzurra nel grafico di mezzo) è
                  pari a $ ${calcs.gaussB}$. 
                  `"
            show: params.disc == 0

          - html: "`
                  Il monopolista può vendere il primo biglietto a 8 euro (ad Alice). Il profitto
                  corrispondente
                  (area verde nel grafico di destra, pari alla somma delle aree verdi nei
                  due grafici a sinistra e al centro) è pari a
                  $$
                  (8-1.50)
                  =
                  6.50
                  \\\\quad \\\\text{euro}
                  $$
                  Il surplus dei consumatori è zero. 
                  `"
            show: params.disc == 1 && params.QD == 1

          - html: "`
                  Il monopolista può vendere il secondo biglietto a 7 euro (ad Alice)
                  <i><b> senza dover ridurre il prezzo del primo</b></i>. Il profitto
                  corrispondente
                  (area verde nel grafico di destra, pari alla somma delle aree verdi nei
                  due grafici a sinistra e al centro) è quindi pari a
                  $$
                  (8-1.50)+(7-1.50)
                  =
                  12
                  \\\\quad \\\\text{euro}
                  $$
                  Il surplus dei consumatori è zero. 
                  `"
            show: params.disc == 1 && params.QD == 2

          - html: "`
                  Il monopolista può vendere il terzo biglietto a 6 euro (ad Alice)
                  <i><b> senza dover ridurre il prezzo dei precedenti</b></i>. Il profitto
                  corrispondente
