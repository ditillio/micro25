schema: EconSchema

params:

- {name: Q, value: 0.5, min: 0, max: 2.5, round: 0.1}
- {name: disc, value: 0}
- {name: mc, value: 2}


calcs:
  P: (10)-(4)*(params.Q) # price with no discrimination
  profit: (params.Q)*((calcs.P)-(params.mc)) # profit with no discrimination
  profitdisc: ((8)+((calcs.P)-(2)))*(params.Q)/(2) # profit with discrimination
  GB: params.Q * 100


aspectRatio: 1.3

layout:
  OneGraphPlusSidebar:

    graph:
      xAxis:
        orient: bottom
        min: 0
        max: 3
        ticks: 0
      yAxis:
        orient: left
        min: -(3)
        max: 12
        ticks: 0
      objects:
      - Label:
              coordinates: [3, 0]
              text: "` \\\\text{        GB} `"
              yPixelOffset: 9
              position: l
      - Label:
              coordinates: [3, 0]
              text: "` \\\\text{(hundreds)} `"
              yPixelOffset: -9
              position: l
      - Label:
            coordinates: [0, 12]
            text: "` \\\\text{euro/100GB}  `"
      - Point:
          coordinates: [0, 0]
          droplines:
            horizontal: 0
          color: black
          r: 0


# market demand function
      - Line:
          yIntercept: (10)
          slope: -(4)
          color: Blue
          max: (2.5)
          strokeWidth: 1.5
          position: b
          label:
            text: "` D^i `"
            x: 2.4
            bgcolor: none
      - Point:
          coordinates: [0, 10]
          droplines:
            horizontal: 10
          color: Blue
          r: 0
      - Point:
          coordinates: [2.5, 0]
          color: Blue
          droplines:
            vertical: 2.5
          r: 0

# marginal revenue
      - Line:
          yIntercept: (10)
          slope: -(8)
          color: Green
          strokeWidth: 1.5
          position: l
          label:
            text: "` MR = 10 - 8Q `"
            y: -(2)


# marginal cost
      - Line:
          yIntercept: (2)
          color: Red
          strokeWidth: 1.5
          position: b
          label:
            text: "` MC  `"
            x: (3)
      - Point:
          coordinates: [0, 2]
          droplines:
            horizontal: 2
          color: Red
          r: 0



# chosen point
      - Point:
          coordinates: [params.Q, calcs.P]
          color: Blue
          r: 3
          droplines:
            vertical: params.Q.toFixed(1)
            horizontal: calcs.P.toFixed(2)
          strokeWidth: 0.5


# monopolist profit/loss
      - Rectangle:
          x1: 0
          y1: 2
          x2: params.Q
          y2: (10)-(4)*(params.Q)
          fill: green
          show: params.Q < 2
      - Area:
          fn1: min((2),(10)-(4)*(x))
          fn2: calcs.P
          fill: purple
          opacity: 0.3
          min: 0
          max: params.Q
          show: params.Q > 2

# consumer surplus / additional prod surplus with discrimination
      - Area:
          fn1: (10)-(4)*(x)
          fn2: max(2,calcs.P)
          fill: blue
          opacity: 0.2
          min: 0
          max: min(2,params.Q)
          show: params.disc == 0
      - Area:
          fn1: (10)-(4)*(x)
          fn2: max(2,calcs.P)
          fill: green
          min: 0
          max: min(2,params.Q)
          show: params.disc == 1

# deadweight loss
      - Area:
          fn1: (2)
          fn2: (10)-(4)*(x)
          fill: gray
          opacity: 0.4
          min: 2
          max: params.Q
          show: params.Q > 2


# evaluation
      - Label:
          coordinates: [2.3,7]
          text: "` \\\\LARGE\\\\text{BINGO!} `" 
          position: c
          bgcolor: none
          color: green
          show: ( params.Q == 1 && params.disc == 0 ) || ( params.Q == 2 && params.disc == 1 )

    sidebar:
      controls:

      - title: FIGURE 5.7
        radioGroup:
          param: disc
          options:
            - Linear prices
            - Perfect discrimination

      - title: Linear prices
        description: Find the quantity that maximizes the monopolist's profit. 
        sliders:
        - param: Q
          label: "` Q `"
        divs:
          - html: "` By producing $Q=0$, the monopolist earns zero profit. `"
            show: params.Q == 0
          - html: "` To sell $ ${calcs.GB.toFixed(0)}$ gigabytes to each consumer, the price
                      must be $ ${calcs.P.toFixed(2)}$ euros / 100GB. The corresponding
                      profit (green area) is:
                    $$
                    (${calcs.P.toFixed(2)}-${params.mc})\\\\times ${params.Q.toFixed(1)} = ${calcs.profit.toFixed(2)}
                    $$
                    `"
            show: params.Q > 0
          - html: "` This is the maximum profit under linear pricing.
                      Without discrimination, the monopolist cannot do better than this.
                     `"
            show: params.Q == 1
        show: params.disc == 0

      - title: Perfect discrimination
        description: Find the quantity that maximizes the monopolist's profit. 
        sliders:
        - param: Q
          label: "` Q `"
        divs:
          - html: "` By producing $Q=0$, the monopolist earns zero profit. `"
            show: params.Q == 0
          - html: "` By selling $ ${calcs.GB.toFixed(0)} $ gigabytes to each consumer, and perfectly
                      discriminating the price at which they are sold, the monopolist
                      captures the entire surplus. Profit (green area) is
                      $ ${calcs.profitdisc.toFixed(2)} $. Consumer surplus is zero.
                    `"
            show: params.Q <= 2
          - html: "` By selling $ ${calcs.GB.toFixed(0)} $ gigabytes to each consumer, and perfectly
                      discriminating the price at which they are sold, the monopolist
                      captures the entire surplus. Profit (difference between green and gray area) is
                      $ ${calcs.profitdisc.toFixed(2)} $. Consumer surplus is zero.
                    `"
            show: params.Q > 2
        show: params.disc == 1

    explanation:
      divs:
        - html: <br><br>
          show: params.Q == 0
        - html: "` The monopolist’s marginal cost is $MC=2$. `"
        - html: "` The demand curve of each consumer is represented by the curve $D^i$. `"
        - html: "` At a linear price of $ ${calcs.P.toFixed(2)} $ euros / 100GB, each consumer
                  buys $ ${calcs.GB.toFixed(0)}$ gigabytes.   `"
          show: params.disc == 0
        - html: "` Each consumer obtains a surplus equal to the blue area, and the monopolist
                  earns a profit equal to the green area. `"
          show: params.disc == 0 && params.Q <= 2
        - html: "` Each consumer obtains a surplus equal to the sum of the blue and purple areas,
                  and the monopolist incurs a loss equal to the sum of the
                  purple and gray areas. `"
          show: params.disc == 0 && params.Q > 2
