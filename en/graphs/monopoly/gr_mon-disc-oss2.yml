schema: EconSchema

params:

- {name: disc, value: 0}
- {name: mc, value: 2}
- {name: P, value: 6, min: 2, max: 18}
- {name: PA, value: 4, min: 2, max: 18}
- {name: PB, value: 4, min: 2, max: 18}


calcs:

  PA: " (params.disc == 0) ? (params.P) : (params.PA) "
  PB: " (params.disc == 0) ? (params.P) : (params.PB) "
  QA: max((0),(4.5)-(calcs.PA)/(4))
  QB: max((0),(2.5)-(calcs.PB)/(4))
  Q: (calcs.QA)+(calcs.QB)
  profit: (500)*(calcs.QA)*((calcs.PA)-(params.mc))+(500)*(calcs.QB)*((calcs.PB)-(params.mc)) # profit



aspectRatio: 1.8

layout:
  TwoHorizontalGraphsPlusSidebar:

    leftGraph:
      xAxis:
        orient: bottom
        min: 0
        max: 6
        ticks: 0
      yAxis:
        orient: left
        min: -(5)
        max: 20
        ticks: 0

      objects:
      - Label:
              coordinates: [5.5, 0]
              text: "` \\\\text{GB} `"
              yPixelOffset: 9
              position: l
      - Label:
              coordinates: [5, 0]
              text: "` \\\\text{(hundreds)} `"
              yPixelOffset: -9
              position: l
      - Label:
            coordinates: [0, 20]
            text: "` \\\\text{euros/100GB}  `"

# market demand function
      - Line:
          yIntercept: (18)
          slope: -(4)
          color: Blue
          max: (4.5)
          strokeWidth: 1.5
          position: b
      - Point:
          coordinates: [0, 18]
          droplines:
            horizontal: 18
          color: Blue
          r: 0
      - Point:
          coordinates: [4.5, 0]
          color: Blue
          droplines:
            vertical: 4.5
          r: 0

# marginal revenue
      - Line:
          yIntercept: (18)
          slope: -(8)
          color: Green
          strokeWidth: 1.5
          position: l
          label:
            text: "` MR_A = 18 - 8Q `"
            y: -(4)


# marginal cost
      - Line:
          yIntercept: (2)
          color: Red
          strokeWidth: 1.5
          max: 5
          position: b
          label:
            text: "` MC  `"
            x: (5)
      - Point:
          coordinates: [0, 2]
          droplines:
            horizontal: 2
          color: Red
          r: 0

# chosen point
      - Point:
          coordinates: [calcs.QA, calcs.PA]
          color: Blue
          r: 3
          droplines:
            vertical: calcs.QA.toFixed(2)
            horizontal: calcs.PA.toFixed(2)
          strokeWidth: 0.5

# monopolist profit/loss
      - Rectangle:
          x1: 0
          y1: 2
          x2: calcs.QA
          y2: calcs.PA
          fill: green

# evaluation
      - Label:
          coordinates: [4,15]
          text: "` \\\\LARGE\\\\text{BINGO!} `" 
          position: c
          bgcolor: none
          color: green
          show: ( calcs.QA == 2.5 && params.disc == 0 ) || ( calcs.QA == 2 && params.disc == 1 )







    rightGraph:
      xAxis:
        orient: bottom
        min: 0
        max: 4.5
        ticks: 0
      yAxis:
        orient: left
        min: -(5)
        max: 20
        ticks: 0
      objects:
      - Label:
              coordinates: [4, 0]
              text: "` \\\\text{GB} `"
              yPixelOffset: 9
              position: l
      - Label:
              coordinates: [3.5, 0]
              text: "` \\\\text{(hundreds)} `"
              yPixelOffset: -9
              position: l
      - Label:
            coordinates: [0, 20]
            text: "` \\\\text{euros/100GB}  `"


# market demand function
      - Line:
          yIntercept: (10)
          slope: -(4)
          color: Blue
          max: (2.5)
          strokeWidth: 1.5
          position: b
      - Point:
          coordinates: [0, 10]
          droplines:
            horizontal: 10
          color: Blue
          r: 0
      - Point:
          coordinates: [2.5, 0]
          color: Blue
          droplines:
            vertical: 2.5
          r: 0

# marginal revenue
      - Line:
          yIntercept: (10)
          slope: -(8)
          color: Green
          strokeWidth: 1.5
          position: l
          label:
            text: "` MR_B = 10 - 8Q `"
            y: -(4)


# marginal cost
      - Line:
          yIntercept: (2)
          color: Red
          strokeWidth: 1.5
          max: 3.5
          position: b
          label:
            text: "` MC  `"
            x: (3.5)
      - Point:
          coordinates: [0, 2]
          droplines:
            horizontal: 2
          color: Red
          r: 0



# chosen point
      - Point:
          coordinates: [calcs.QB, calcs.PB]
          color: Blue
          r: 3
          droplines:
            vertical: calcs.QB.toFixed(2)
            horizontal: calcs.PB.toFixed(2)
          strokeWidth: 0.5


# monopolist profit/loss
      - Rectangle:
          x1: 0
          y1: 2
          x2: calcs.QB
          y2: calcs.PB
          fill: green


# evaluation
      - Label:
          coordinates: [3,15]
          text: "` \\\\LARGE\\\\text{BINGO!} `" 
          position: c
          bgcolor: none
          color: green
          show: ( calcs.QB == 0.5 && params.disc == 0 ) || ( calcs.QB == 1 && params.disc == 1 )





    sidebar:
      controls:

      - title: FIGURE 5.9

        radioGroup:
          param: disc
          options:
            - Choose uniform price
            - Choose separate prices for each group


      - title: Uniform price
        description: Find the price (the same for both groups) that maximizes the monopolist’s profit. 
        sliders:
        - param: P
          label: "` P `"
        divs:
          - html: "` At this price ($P=${params.P}$) profit equals ${calcs.profit}.
                      It is possible to obtain a higher profit by choosing a different uniform price.
                       `"
            show: params.P !== 8
          - html: "` At this price ($P=${params.P}$) profit equals ${calcs.profit}.
                      It is not possible to obtain a higher profit by choosing a different uniform price.
                      However, it is possible to obtain a higher profit by choosing separate prices for the two groups!
                       `"
            show: params.P == 8
        show: params.disc == 0


      - title: Separate prices by group
        description: Find the prices (which may differ for the two groups) that maximize the monopolist’s profit.
        sliders:
        - param: PA
          label: "` P_A `"
        - param: PB
          label: "` P_B `"
        divs:
          - html: "` At these prices ($P_A=${params.PA}$ and $P_B=${params.PB}$) profit 
                      equals ${calcs.profit}.
                      It is possible to obtain a higher profit by choosing different prices.
                       `"
            show: params.PA !== 10 && params.PB !== 6
          - html: "` At these prices ($P_A=${params.PA}$ and $P_B=${params.PB}$) profit 
                      equals ${calcs.profit}.
                      It is not possible to obtain a higher profit by choosing a different price
                      for group A. However, it is possible to obtain a higher profit by choosing
                      a different price for group B!
                       `"
            show: params.PA == 10 && params.PB !== 6
          - html: "` At these prices ($P_A=${params.PA}$ and $P_B=${params.PB}$) profit 
                      equals ${calcs.profit}.
                      It is not possible to obtain a higher profit by choosing a different price
                      for group B. However, it is possible to obtain a higher profit by choosing
                      a different price for group A!
                       `"
            show: params.PA !== 10 && params.PB == 6
          - html: "` At these prices ($P_A=${params.PA}$ and $P_B=${params.PB}$) profit 
                      equals ${calcs.profit}.
                      It is not possible to obtain a higher profit!
                       `"
            show: params.PA == 10 && params.PB == 6
        show: params.disc == 1








    explanation:
      divs:
        - html: "` The demand function is represented by the blue points. `"
        - html: "` The marginal revenue function is represented by the green points. `"
        - html: "` At the price $P=${params.P}$ each of the 500 consumers in group A
                  demands ${calcs.QA} units and each of the 500 consumers in group B 
                  demands ${calcs.QB} units. Profit is therefore equal to 
                    $$
                    500\\\\times (${params.P}-${params.mc})\\\\times ${calcs.QA}
                    +
                    500\\\\times (${params.P}-${params.mc})\\\\times ${calcs.QB}=${calcs.profit}
                    $$ `"
          show: params.disc == 0
        - html: "` At the prices $P_A=${params.PA}$ and $P_B=${params.PB}$ each of the 500
                  consumers in group A
                  demands ${calcs.QA} units and each of the 500 consumers in group B 
                  demands ${calcs.QB} units. Profit is therefore equal to 
                    $$
                    500\\\\times (${params.P}-${params.mc})\\\\times ${calcs.QA}
                    +
                    500\\\\times (${params.P}-${params.mc})\\\\times ${calcs.QB}=${calcs.profit}
                    $$ `"
          show: params.disc == 1
