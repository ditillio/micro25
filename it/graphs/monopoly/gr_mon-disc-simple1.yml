---
schema: EconSchema
version: 1
# aspectRatio: 1.3
params:

# Alice bundles
  - {name: x1a, value: 1, min: 0, max: 9, round: 0.5}
  - {name: x2a, value: 8, min: 0, max: 9, round: 0.5}
  - {name: x1aa, value: 4, min: 0, max: 9, round: 0.5}
  - {name: x2aa, value: 2, min: 0, max: 9, round: 0.5}

# Bruno bundles
  - {name: x1b, value: 1, min: 0, max: 9, round: 0.5}
  - {name: x2b, value: 8, min: 0, max: 9, round: 0.5}
  - {name: x1bb, value: 4, min: 0, max: 9, round: 0.5}
  - {name: x2bb, value: 2, min: 0, max: 9, round: 0.5}

# Carmen bundles
  - {name: x1c, value: 1, min: 0, max: 9, round: 0.5}
  - {name: x2c, value: 8, min: 0, max: 9, round: 0.5}
  - {name: x1cc, value: 4, min: 0, max: 9, round: 0.5}
  - {name: x2cc, value: 2, min: 0, max: 9, round: 0.5}
  - {name: s, value: 5}


# consumption levels of X
  - {name: c1, value: 1}
  - {name: c2, value: 2}
  - {name: c3, value: 3}
  - {name: c4, value: 4}
  - {name: c5, value: 5}
  - {name: c6, value: 6}
  - {name: c7, value: 7}
  - {name: c8, value: 8}
  - {name: c9, value: 9}


  - {name: Q, value: 0, min: 0, max: 3}
  - {name: QA, value: 0, min: 0, max: 2}
  - {name: QB, value: 0, min: 0, max: 1}
  - {name: disc, value: 0}
  - {name: mc, value: 2}
  - {name: different, value: 0}
  - {name: nonlinear, value: 0}



calcs:

  P: " (params.Q == 1) ? (7) : ( (params.Q == 2) ? (5) : (3) ) "

  PA: " (params.QA == 1) ? (7) : (3) "

  PB: " (params.QB == 1) ? (5) : (0) "

  profit: (params.Q)*((calcs.P)-(params.mc)) # profit with no discrimination

  profit3: (params.QA)*((calcs.PA)-(params.mc))+(params.QB)*((calcs.PB)-(params.mc)) # profit with 3rd degree discrimination

# Alice utility and MRS at selected bundle
  ua: ((params.x1a)^(1))*((params.x2a)^(1))
  uaa: ((params.x1aa)^(1))*((params.x2aa)^(1))
  MRSa: ((1)/(1))*((params.x2a)/(params.x1a))

# Bruno utility and MRS at selected bundle
  ub: ((params.x1b)^(2))*((params.x2b)^(1))
  ubb: ((params.x1bb)^(2))*((params.x2bb)^(1))
  MRSb: ((2)/(1))*((params.x2b)/(params.x1b))

# Carmen utility and MRS at selected bundle
  uc: ((params.x1c)+(params.s))*((params.x2c)+(params.s))
  ucc: ((params.x1cc)+(params.s))*((params.x2cc)+(params.s))
  MRSc: ((params.x2c)+(params.s))/((params.x1c)+(params.s))


# Alice utility levels
  u1a: ((params.c1)^(1))*((params.c1)^(1))
  u2a: ((params.c2)^(1))*((params.c2)^(1))
  u3a: ((params.c3)^(1))*((params.c3)^(1))
  u4a: ((params.c4)^(1))*((params.c4)^(1))
  u5a: ((params.c5)^(1))*((params.c5)^(1))
  u6a: ((params.c6)^(1))*((params.c6)^(1))
  u7a: ((params.c7)^(1))*((params.c7)^(1))
  u8a: ((params.c8)^(1))*((params.c8)^(1))
  u9a: ((params.c9)^(1))*((params.c9)^(1))

# Bruno utility levels
  u1b: ((params.c1)^(2))*((params.c1)^(1))
  u2b: ((params.c2)^(2))*((params.c2)^(1))
  u3b: ((params.c3)^(2))*((params.c3)^(1))
  u4b: ((params.c4)^(2))*((params.c4)^(1))
  u5b: ((params.c5)^(2))*((params.c5)^(1))
  u6b: ((params.c6)^(2))*((params.c6)^(1))
  u7b: ((params.c7)^(2))*((params.c7)^(1))
  u8b: ((params.c8)^(2))*((params.c8)^(1))
  u9b: ((params.c9)^(2))*((params.c9)^(1))

# Carmen utility levels
  u1c: ((params.c1)+(params.s))^(2)
  u2c: ((params.c2)+(params.s))^(2)
  u3c: ((params.c3)+(params.s))^(2)
  u4c: ((params.c4)+(params.s))^(2)
  u5c: ((params.c5)+(params.s))^(2)
  u6c: ((params.c6)+(params.s))^(2)
  u7c: ((params.c7)+(params.s))^(2)
  u8c: ((params.c8)+(params.s))^(2)
  u9c: ((params.c9)+(params.s))^(2)


layout:

  type: ThreeHorizontalGraphs

  def:

    leftGraph:
      xAxis:
        max: 3
        ticks: 0
        title: Domanda di Alice
      yAxis:
        max: 8
        ticks: 0


      objects:

      - Label:
            coordinates: [3, 0]
            text: "` \\\\text{GB} `"
      - Label:
            coordinates: [0, 8]
            text: "` \\\\text{euro/GB} `"

      - Point:
          coordinates: [1, 7]
          droplines:
            horizontal: 7
            vertical: 1
          color: Blue
          r: 3 
          strokeWidth: 0.5

      - Point:
          coordinates: [2, 3]
          droplines:
            horizontal: 3
            vertical: 2
          color: Blue
          r: 3 
          strokeWidth: 0.5

# price line with no discrimination
      - Line:
          yIntercept: calcs.P
          color: Green
          strokeWidth: 1
          position: l
          show: params.different == 0 && params.nonlinear == 0

# Alice surplus without discrimination
      - Rectangle:
          x1: 0
          y1: calcs.P
          x2: 1
          y2: 7
          fill: blue
          show: params.different == 0 && params.nonlinear == 0 && params.Q > 0

# marginal cost
      - Line:
          yIntercept: 2
          color: Red
          strokeWidth: 1
          position: l
          label:
            text: MC
            x: 3
          show: params.different == 1
      - Point:
          coordinates: [0, 2]
          droplines:
            horizontal: 2
            vertical: 
          color: Red
          r: 0
          show: params.different == 1

# profit with 3rd degree discrimination
      - Rectangle: {x1: 0, y1: 2, x2: params.QA, y2: calcs.PA, fill: green, show: params.different == 1 && params.nonlinear == 0 }

# cost
      - Rectangle:
          x1: 0
          y1: 0
          x2: params.QA
          y2: 2
          fill: red
          show: params.different == 1 && params.nonlinear == 0

# Alice surplus with 3rd degree discrimination
      - Rectangle:
          x1: 0
          y1: 3
          x2: 1
          y2: 7
          fill: blue
          show: params.different == 1 && params.nonlinear == 0 && params.QA == 2











    middleGraph:
      xAxis:
        max: 3
        ticks: 0
        title: Domanda di Bruno
      yAxis:
        max: 8
        ticks: 0


      objects:

      - Label:
            coordinates: [3, 0]
            text: "` \\\\text{GB} `"
      - Label:
            coordinates: [0, 8]
            text: "` \\\\text{euro/GB} `"

      - Point:
          coordinates: [1, 5]
          droplines:
            horizontal: 5
            vertical: 1
          color: Blue
          r: 3 
          strokeWidth: 0.5

# price line with no discrimination
      - Line:
          yIntercept: calcs.P
          color: Green
          strokeWidth: 1
          position: l
          show: params.different == 0 && params.nonlinear == 0

# Bruno surplus without discrimination
      - Rectangle:
          x1: 0
          y1: calcs.P
          x2: 1
          y2: 5
          fill: blue
          show: params.different == 0 && params.nonlinear == 0 && calcs.P < 5 && params.Q > 0

# marginal cost
      - Line:
          yIntercept: 2
          color: Red
          strokeWidth: 1
          position: l
          label:
            text: MC
            x: 3
          show: params.different == 1

# profit with 3rd degree discrimination
      - Rectangle: {x1: 0, y1: 2, x2: params.QB, y2: calcs.PB, fill: green, show: params.different == 1 && params.nonlinear == 0 }

# cost
      - Rectangle:
          x1: 0
          y1: 0
          x2: params.QB
          y2: 2
          fill: red
          show: params.different == 1 && params.nonlinear == 0










    rightGraph:
      xAxis:
        max: 4
        ticks: 0
        title: Domanda di mercato
      yAxis:
        orient: left
        min: 0
        max: 8
        ticks: 0


      objects:

      - Label:
            coordinates: [4, 0]
            text: "` \\\\text{GB} `"
      - Label:
            coordinates: [0, 8]
            text: "` \\\\text{euro/GB} `"

      - Point:
          coordinates: [1, 7]
          droplines:
            horizontal: 7
            vertical: 1
          color: Blue
          r: 3 
          strokeWidth: 0.5
      - Point:
          coordinates: [2, 5]
          droplines:
            horizontal: 5
            vertical: 2
          color: Blue
          r: 3 
          strokeWidth: 0.5
      - Point:
          coordinates: [3, 3]
          droplines:
            horizontal: 3
            vertical: 3
          color: Blue
          r: 3 
          strokeWidth: 0.5




# marginal cost
      - Line:
          yIntercept: 2
          color: Red
          strokeWidth: 1
          position: l
          label:
            text: MC
            x: 4
          show: params.different == 0

      - Point:
          coordinates: [0, 2]
          droplines:
            horizontal: 2
            vertical: 
          color: Red
          r: 0
          show: params.different == 0

# price line with no discrimination
      - Line:
          yIntercept: calcs.P
          color: Green
          strokeWidth: 1
          position: l
          label:
            text: P
            x: 4
          show: params.different == 0 && params.nonlinear == 0

# cost
      - Rectangle:
          x1: 0
          y1: 0
          x2: params.Q
          y2: 2
          fill: red
          show: params.different == 0 && params.nonlinear == 0

# profit with no discrimination
      - Rectangle: {x1: 0, y1: 2, x2: params.Q, y2: calcs.P, fill: green, show: params.different == 0 && params.nonlinear == 0 }

# evaluation
      - Label:
          coordinates: [3,6]
          text: "` \\\\LARGE\\\\text{BINGO!} `" 
          position: c
          bgcolor: none
          color: green
          show: params.different == 0 && params.nonlinear == 0 && params.Q == 2


# consumer surplus without discrimination
      - Rectangle:
          x1: 0
          y1: calcs.P
          x2: 1
          y2: 7
          fill: blue
          show: params.different == 0 && params.nonlinear == 0 && params.Q >= 1
      - Rectangle:
          x1: 1
          y1: calcs.P
          x2: 2
          y2: 5
          fill: blue
          show: params.different == 0 && params.nonlinear == 0 && calcs.P < 5 && params.Q >= 2









    leftControls:
      title: Modalità di discriminazione
      description: Scegliere se trattare Alice e Brunoo diversamente e, in quel caso, se proporre prezzi lineari o nonlineari.
      checkboxes:
      - param: different
        label: " \\text{Tratta diversamente} "
      - param: nonlinear
        label: " \\text{Prezzi nonlineari} "
        show: params.different == 1
      divs:
      - html: <br>

    middleControls:
      title: Prezzi e quantità
      sliders:
      - param: Q
        label: " Q "
        show: params.different == 0
      - param: QA
        label: " Q_A "
        show: params.different == 1  && params.nonlinear == 0
      - param: QB
        label: " Q_B "
        show: params.different == 1  && params.nonlinear == 0
      divs:
      - html: "` Selezionare la quantità da vendere ad un prezzo lineare uguale per Alice e Bruno. `"
        show: params.different == 0 && params.nonlinear == 0
      - html: "` Selezionare le quantità da vendere ad Alice e Bruno a 
                  prezzi lineari personalizzati. `"
        show: params.different == 1 && params.nonlinear == 0


    # rightControls:
    #   title: " Profitto "
    #   divs:
    #   - html: <br>



    explanation:
      divs:
        - html: "` Per vendere $ ${params.Q}$ unità ad un prezzo lineare uguale per tutti,
                    il monopolista deve fissare il prezzo a $P=${calcs.P} $. `"
          show: params.different == 0 && params.nonlinear == 0 && params.Q > 0
        - html: "` Il profitto corrispondente (area verde) è pari a
                     $ (${calcs.P}-2)\\\\times ${params.Q} = ${calcs.profit} $. `"
          show: params.different == 0 && params.nonlinear == 0 && params.Q > 0
        - html: <br>
          show: params.different == 1
        - html: "` Per vendere $ ${params.QA}$ unità ad Alice,
                    il monopolista deve fissare il prezzo a $P_A=${calcs.PA}$. `"
          show: params.different == 1 && params.nonlinear == 0 && params.QA > 0
        - html: "` Per vendere $ ${params.QB}$ unità a Bruno,
                    il monopolista deve fissare il prezzo a $P_B=${calcs.PB}$. `"
          show: params.different == 1 && params.nonlinear == 0 && params.QB > 0
        - html: "` Il profitto corrispondente (somma delle aree verdi) è pari a
                    $ (${calcs.PA}-2)\\\\times ${params.QA}
                    + (${calcs.PB}-2)\\\\times ${params.QB} = ${calcs.profit3} $. `"
          show: params.different == 1 && params.nonlinear == 0 && params.QA > 0 && params.QB > 0
        - html: "` Il profitto corrispondente (somma delle aree verdi) è pari a
                    $ (${calcs.PA}-2)\\\\times ${params.QA}
                     = ${calcs.profit3} $. `"
          show: params.different == 1 && params.nonlinear == 0 && params.QA > 0 && params.QB == 0
        - html: "` Il profitto corrispondente (somma delle aree verdi) è pari a
                    $ (${calcs.PB}-2)\\\\times ${params.QB} = ${calcs.profit3} $. `"
          show: params.different == 1 && params.nonlinear == 0 && params.QA == 0 && params.QB > 0












